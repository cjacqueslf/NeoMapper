name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproj 3.6 is intentionally kept for the stable Windows PROJ 9.3
        # runtime used by the packaged application. Its published Windows
        # wheels currently support Python 3.11 and 3.12 only.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  package:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[release]"
      - run: python -m build
      - run: python -m twine check dist/*

  windows-app:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,release]"
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: .\scripts\build_release.ps1 -SkipTests
      - uses: actions/upload-artifact@v6
        with:
          name: NEOMapper-Windows-x64
          path: |
            dist/NEOMapper-*-Windows-x64-Setup.exe
            dist/NEOMapper-Windows-x64.zip
            dist/Manual_do_Usuario_NEOMapper_*.docx
            dist/neomapper-*.whl
            dist/neomapper-*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
