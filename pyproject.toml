[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neomapper"
dynamic = ["version"]
description = "Aplicação desktop para planejamento observacional de objetos próximos da Terra"
readme = "README.md"
license = "MIT"
maintainers = [
    {name = "cjacqueslf", email = "cjacqueslf@gmail.com"},
]
requires-python = ">=3.11,<3.13"
keywords = ["astronomy", "near-earth-objects", "observational-planning", "planetary-defense"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=7.1,<8",
    "astroquery>=0.4.10,<0.5",
    "cartopy>=0.25,<0.26",
    "imageio>=2.37,<3",
    "imageio-ffmpeg>=0.6,<0.7",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "packaging>=25,<27",
    "pyproj>=3.6.1,<3.7",
    "pyshp>=2.3,<3",
    "PySide6>=6.10,<6.11",
    "reportlab>=4.2,<5",
    "requests>=2.32,<3",
    "shapely>=2.1,<3",
    "timezonefinder>=6.5,<9",
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/cjacqueslf/NeoMapper"
Repository = "https://github.com/cjacqueslf/NeoMapper"
Issues = "https://github.com/cjacqueslf/NeoMapper/issues"
Changelog = "https://github.com/cjacqueslf/NeoMapper/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
release = [
    "build>=1.3,<2",
    "pyinstaller>=6.16,<7",
    "python-docx>=1.1,<2",
    "twine>=6.2,<7",
]

[project.scripts]
neomapper = "neomapper.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "neomapper.shared.version.APP_VERSION"}

[tool.setuptools.package-data]
"neomapper.presentation" = ["data/*.npz", "data/*.png", "data/*.ico", "locales/*.json"]

[tool.setuptools.data-files]
"." = ["THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not network'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that access external ephemeris providers",
]
